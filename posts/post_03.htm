<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Materializar un rayo</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      font-family: 'Georgia', serif;
      background-color: #f9f9f9;
      color: #222;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 20px;
      color: #111;
    }

    p {
      font-size: 18px;
      margin-bottom: 16px;
    }

    @media (max-width: 600px) {
      body {
        margin: 20px;
        padding: 10px;
      }

      p {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>

  <h1>Materializar un rayo</h1>

  <p>
    Materializar un rayo —es decir, hacer que un rayo (una descarga eléctrica atmosférica) se manifieste de forma controlada y visible— es un concepto que mezcla ciencia, tecnología avanzada y, a menudo, elementos de ciencia ficción o magia (según el contexto).
  </p>

</body>
</html>
